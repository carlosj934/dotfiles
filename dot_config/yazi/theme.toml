[flavor]
dark = "nord"

# Overrides on the nord flavor swapping its blue-tinted whites for neutral #E7E7E7/#F7F7F7.

[status]
progress_label = { fg = "#F7F7F7", bold = true }

[pick]
inactive = { fg = "#E7E7E7" }

[input]
title = { fg = "#E7E7E7" }
value = { fg = "#F7F7F7" }

[tasks]
title = { fg = "#F7F7F7" }

[help]
footer = { fg = "#2E3440", bg = "#F7F7F7" }

# Lists replace rather than merge, so the flavor's rules are repeated with only the fallback color changed.
[filetype]
rules = [
  { mime = "image/*", fg = "#8FBCBB" },
  { mime = "{audio,video}/*", fg = "#EBCB8B" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#B48EAD" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#A3BE8C" },
  { url = "*", fg = "#E7E7E7" },
  { url = "*/", fg = "#81A1C1", bold = true },
]
